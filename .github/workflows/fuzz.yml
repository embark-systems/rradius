name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fixed, as what runs here runs in CI: raise it by hand, with the `cargo-fuzz` version below.
  FUZZ_NIGHTLY: nightly-2026-11-05

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [radius_packet, tacacs_packet, eap_packet, dictionary, attribute_text]
    defaults:
      run:
        working-directory: rradius-server/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rradius-server/fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +"$FUZZ_NIGHTLY" fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- -max_total_time=300
      - name: Keep what made it fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: rradius-server/fuzz/artifacts/${{ matrix.target }}

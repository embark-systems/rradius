name: CI

on:
  push:
    branches: [main]
  pull_request:
  # To run it again on main by hand, as after it was turned back on.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fixed, as what runs here runs in CI: raise it by hand, with the `cargo-fuzz` version below.
  FUZZ_NIGHTLY: nightly-2026-11-05

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # The workspace at the repository's root, with its target/ there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The library and the program built on it, and the load generator that
      # rradius-server/tests/bench_test.rs runs against the program.
      - run: cargo build --locked -p rradius-core -p rradius-server -p rradius-bench
      - run: cargo clippy --locked -p rradius-core -p rradius-server --all-targets
      - run: cargo test --locked -p rradius-core -p rradius-server

  ldap:
    # Runs a real OpenLDAP server in Docker, which `cargo test` skips.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p rradius-server --test ldap_test -- --ignored

  bench:
    # The load generator, a member of the workspace; its tests start a real server. The ones
    # that need rradius-enterprise say so and pass when it is not built.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p rradius-bench
      - run: cargo clippy --locked -p rradius-bench --all-targets
      - run: cargo test --locked -p rradius-bench

  fuzz:
    # Replays the seeds only, so that a pull request fails for what it changed. The
    # random search runs on its own schedule, in fuzz.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rradius-server/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rradius-server/fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          for target in radius_packet tacacs_packet eap_packet dictionary attribute_text; do
            cargo +"$FUZZ_NIGHTLY" fuzz run "$target" "seeds/$target" -- -runs=0
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker/init-secrets.sh
      - name: Single node
        run: |
          docker compose up --build --detach
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          # A clean stop keeps the database, and the node comes back with it.
          docker compose stop
          docker compose start
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          docker compose down --volumes
      - name: Three nodes
        run: |
          docker compose --file compose.cluster.yaml up --detach
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          docker/smoke-test.py --auth-port 2812 --acct-port 2813
          docker/smoke-test.py --auth-port 3812 --acct-port 3813
          docker compose --file compose.cluster.yaml down --volumes
      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color || true
          docker compose --file compose.cluster.yaml logs --no-color || true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The jobs that need Docker or take long (ldap, external-db, docker) run only here,
  # once a week on main, and when started by hand; a push or a pull request runs test and
  # bench. After a change to LDAP, [databases] or the Docker files, start
  # CI by hand on the branch before merging.
  schedule:
    - cron: '7 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # The workspace at the repository's root, with its target/ there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The library and the program built on it, and the load generator that
      # rradius-server/tests/bench_test.rs runs against the program.
      - run: cargo build --locked -p rradius-core -p rradius-server -p rradius-bench
      - run: cargo clippy --locked -p rradius-core -p rradius-server --all-targets
      - run: cargo test --locked -p rradius-core -p rradius-server

  deny:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The crates of Cargo.lock against the RustSec advisory database, and where they come from. It
    # runs here and not on every push because the database changes: the same lock file can pass
    # today and fail next week. The licenses are checked by packages/tarball/release.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check advisories sources
      - run: cargo deny --locked --manifest-path rradius-server/fuzz/Cargo.toml check advisories sources

  ldap:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Runs a real OpenLDAP server in Docker, which `cargo test` skips.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p rradius-server --test ldap_test -- --ignored

  external-db:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Runs MySQL 8.4 and PostgreSQL 17 in Docker for [databases], which `cargo test` skips.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p rradius-server --test external_db_test -- --ignored

  bench:
    # The load generator, a member of the workspace; its tests start a real server. The ones
    # that need rradius-enterprise say so and pass when it is not built.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p rradius-bench
      - run: cargo clippy --locked -p rradius-bench --all-targets
      - run: cargo test --locked -p rradius-bench

  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker/init-secrets.sh
      - name: Single node
        run: |
          docker compose up --build --detach
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          # A clean stop keeps the database, and the node comes back with it.
          docker compose stop
          docker compose start
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          docker compose down --volumes
      - name: Three nodes
        run: |
          docker compose --file compose.cluster.yaml up --detach
          docker/smoke-test.py --auth-port 1812 --acct-port 1813
          docker/smoke-test.py --auth-port 2812 --acct-port 2813
          docker/smoke-test.py --auth-port 3812 --acct-port 3813
          docker compose --file compose.cluster.yaml down --volumes
      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color || true
          docker compose --file compose.cluster.yaml logs --no-color || true

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The workspace at the root: rradius-core, rradius-server and rradius-bench, with one Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Together, as they rarely break anything. A major version gets a PR of its own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /rradius-server/fuzz
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

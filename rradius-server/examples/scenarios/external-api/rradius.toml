# Accounts are in another system: the member (or billing) system already has accounts and passwords, rradius stores no accounts,
# and asks its API over HTTPS at every login.
# See: docs/manual/15-access-recipes.md "Accounts in an external system: external-api"

dictionary = "../../../../share/dictionary"

# Accounting is still written to local tables, using the quick-start script.
[lua]
script = "accounting.lua"

# The script can call only the hosts listed here. Without this section, http_request does not exist in the script.
[lua.http]
allowed_hosts = ["members.example.com"]   # host only: allows HTTPS on port 443 only
timeout_ms = 1500        # keep it shorter than the NAS retransmit time
max_concurrent = 64      # at most this many requests waiting on this host at once

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[auth]
policy = "first_match"

[[auth.handlers]]
type = "lua"
script = "member-api.lua"
# This script really did hand the password to the API for comparison. EAP-TTLS inner PAP is allowed only with this setting.
verifies_password = true

[radius]
bind = "0.0.0.0"
status_server = true

[[radius.clients]]
name = "hotspot"
address = "10.95.0.0/24"
secret_file = "hotspot.secret"

[metrics]

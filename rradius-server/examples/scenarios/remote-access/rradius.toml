# Remote access: the VPN gateway logs in with accounts from the company directory (LDAP/AD), only people in the vpn group can connect,
# and different access rules are given by group; the jump host additionally requires a password plus a TOTP code.
# See: docs/manual/15-access-recipes.md "Remote access: remote-access"

dictionary = "../../../../share/dictionary"

# Accounting is handled by the quick start script. Both clients specify the chain, so authentication never reaches here.
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# VPN: find the user with a service account, then verify the password by binding as the user (PAP only).
[auth.chains.vpn]
policy = "first_match"

[[auth.chains.vpn.handlers]]
type = "ldap"
urls = ["ldaps://dc1.corp.example.com", "ldaps://dc2.corp.example.com"]
bind_dn = "CN=svc-radius,OU=Service Accounts,DC=corp,DC=example,DC=com"
bind_password_file = "ldap.secret"
base_dn = "OU=People,DC=corp,DC=example,DC=com"
# AD: a disabled account (bit 2 of userAccountControl) is not found, which is the same as not existing.
filter = "(&(sAMAccountName={user})(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
password_check = "bind"
required_groups = ["CN=vpn-users,OU=Groups,DC=corp,DC=example,DC=com"]
# ca_file = "corp-ca.pem"          # for when the directory server's certificate is not signed by a CA the system trusts

# The group decides which set of rules the VPN gateway applies (the gateway needs a filter/group policy of the same name).
[[auth.chains.vpn.handlers.group_reply]]
group = "CN=it-staff,OU=Groups,DC=corp,DC=example,DC=com"
attributes = { "Filter-Id" = "vpn-it" }

[[auth.chains.vpn.handlers.group_reply]]
group = "CN=contractors,OU=Groups,DC=corp,DC=example,DC=com"
attributes = { "Filter-Id" = "vpn-contractor", "Session-Timeout" = "28800" }

# The user may type CORP\alice or alice@corp.example.com.
[auth.chains.vpn.username]
strip_realm = "both"
lowercase = true

# Jump host: after the password, reply Access-Challenge to ask for a TOTP code.
[auth.chains.mfa]
policy = "first_match"

[[auth.chains.mfa.handlers]]
type = "lua"
script = "two-step-totp.lua"

[radius]
bind = "0.0.0.0"
status_server = true

[[radius.clients]]
name = "vpn-gw"
address = "10.60.0.1"
secret_file = "vpn-gw.secret"
auth = "vpn"

[[radius.clients]]
name = "jump-host"
address = "10.60.0.20"
secret_file = "jump-host.secret"
auth = "mfa"

[metrics]

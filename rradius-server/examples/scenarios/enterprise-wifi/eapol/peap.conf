# eapol_test 的 PEAP-MSCHAPv2 設定，在 enterprise-wifi/ 目錄執行：
#   eapol_test -c eapol/peap.conf -a 127.0.0.1 -s wlc-shared-secret-change-me
network={
	key_mgmt=WPA-EAP
	eap=PEAP
	# 外層名稱可以是匿名的，rradius 用內層名稱查帳號。
	anonymous_identity="anonymous@corp.example.com"
	identity="staff1@corp.example.com"
	password="staff1-password"
	phase2="auth=MSCHAPV2"
	# 一定要驗證伺服器憑證，否則假的基地台能拿到密碼的雜湊。
	ca_cert="certs/ca.pem"
	domain_match="radius.corp.example.com"
}

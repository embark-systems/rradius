# eapol_test settings for PEAP-MSCHAPv2; run from the enterprise-wifi/ directory:
#   eapol_test -c eapol/peap.conf -a 127.0.0.1 -s wlc-shared-secret-change-me
network={
	key_mgmt=WPA-EAP
	eap=PEAP
	# The outer name can be anonymous; rradius uses the inner name to look up the account.
	anonymous_identity="anonymous@corp.example.com"
	identity="staff1@corp.example.com"
	password="staff1-password"
	phase2="auth=MSCHAPV2"
	# Always verify the server certificate, otherwise a fake access point can get the password hash.
	ca_cert="certs/ca.pem"
	domain_match="radius.corp.example.com"
}

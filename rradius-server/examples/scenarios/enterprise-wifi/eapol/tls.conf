# eapol_test 的 EAP-TLS 設定，在 enterprise-wifi/ 目錄執行：
#   eapol_test -c eapol/tls.conf -a 127.0.0.1 -s wlc-shared-secret-change-me
network={
	key_mgmt=WPA-EAP
	eap=TLS
	# 要和憑證上的名稱（DNS SAN）相同。
	identity="laptop-001.corp.example.com"
	ca_cert="certs/ca.pem"
	domain_match="radius.corp.example.com"
	client_cert="certs/device.pem"
	private_key="certs/device.key"
}

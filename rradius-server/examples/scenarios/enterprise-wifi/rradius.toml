# Enterprise Wi-Fi (WPA2/WPA3-Enterprise, 802.1X): company-issued computers use a certificate (EAP-TLS),
# employees' own phones use user name and password (PEAP-MSCHAPv2), and each group is put in a different VLAN.
# See: docs/manual/11-eap.md "802.1X and EAP"
#
# The certificates are not in the repo; run ./make-certs.sh first to create a demo CA and server certificate.

dictionary = "../../../../share/dictionary"

# With [auth] set, this script handles accounting only.
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# Users and devices are in one table. After a certificate passes, certificate_query is used; for password logins, user_query.
# Both reply with the VLAN of the group.
[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM accounts WHERE name = ? AND kind = 'user' AND enabled = 1"
certificate_query = "SELECT 1 FROM accounts WHERE name = ? AND kind = 'device' AND enabled = 1"
reply_query = "SELECT r.attribute, r.value FROM accounts a JOIN group_reply r ON r.grp = a.grp WHERE a.name = ?"

# An employee may type Alice@corp.example.com, while the table stores lowercase names without the realm.
# Certificate logins do not strip the realm (see docs/usage.md section 2.12), so a device's name is the full name on its certificate.
[auth.username]
strip_realm = "suffix"
lowercase = true

[radius]
bind = "0.0.0.0"
status_server = true

[radius.eap]
cert_file = "certs/server.pem"
key_file = "certs/server.key"
client_ca_file = "certs/ca.pem"
methods = ["tls", "peap"]

# The wireless controller. Offer EAP-TLS first; devices without a certificate can fall back to PEAP.
[[radius.clients]]
name = "wlc"
address = "10.30.0.10"
secret_file = "wlc.secret"
eap_methods = ["tls", "peap"]

[metrics]

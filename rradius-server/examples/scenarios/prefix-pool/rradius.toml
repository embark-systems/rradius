# IPv6 prefix pool (DHCPv6-PD): single node; a delegated prefix is allocated from the pool at authentication, and accounting confirms and releases it.
# See: docs/manual/14-isp-recipes.md "IPv6 prefix pool: prefix-pool"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/prefix-pool/rradius.toml
#
# Relative paths are all relative to the directory this file is in.

dictionary = "../../../../share/dictionary"

# With [auth] configured, authentication goes to the chain below; this script only handles accounting (confirm, extend, release prefixes).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept: run in order and stop at the first reject. The sql handler checks the password first (a wrong password does not go further, so no prefix is
# allocated to someone who did not pass), then the lua handler allocates the prefix.
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "allocate.lua"

[radius]
bind = "127.0.0.1"
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

# Sessions online now: rradiusd session list. The prefix pool itself records who uses which prefix,
# so query it directly: rows whose state is active and that have not expired.
[sessions]
list = "SELECT username, nas, session_id, prefix, updated FROM prefix_leases WHERE state = 'active' AND expires > strftime('%s', 'now') ORDER BY pool, n"
show = "SELECT username, nas, session_id, prefix, updated FROM prefix_leases WHERE username = ?1 AND state = 'active' AND expires > strftime('%s', 'now') ORDER BY pool, n"

# Monitoring: the number of prefixes in each state (reserved, active, released) of each pool, the pool capacity, and the age of the oldest released one become the metrics
# rradius_query_prefix_leases{pool,state}, rradius_query_prefix_capacity{pool}, rradius_query_prefix_hold_age{pool}.
# Utilization counts only reserved and active: released ones are kept for offline users and can be taken when needed; see "When the pool is nearly full" in manual chapter 14, "IPv6 prefix pool: prefix-pool".
[queries.prefix_leases]
sql = "SELECT pool, state, count(*) AS prefixes FROM prefix_leases GROUP BY pool, state"
help = "Prefixes of each pool by state: reserved, active, or released (kept for a user who went offline)."
labels = ["pool", "state"]
value = "prefixes"

[queries.prefix_capacity]
sql = "SELECT pool, 1 << (dlen - plen) AS capacity FROM prefix_pools"
help = "Prefixes each pool can give out."
labels = ["pool"]
value = "capacity"

[queries.prefix_hold_age]
sql = "SELECT pool, strftime('%s', 'now') - min(updated) AS age FROM prefix_leases WHERE state = 'released' GROUP BY pool"
help = "Seconds since the oldest released prefix of each pool was released: the hold time that is guaranteed at the moment."
labels = ["pool"]
value = "age"

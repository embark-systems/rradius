# Line identity authentication (fixed broadband IPoE): the BNG puts the DHCP Option 82 circuit-id and remote-id in the RADIUS request,
# the subscriber has no password, and "which line" is the identity. A known line gets a pool name and a profile name back; an unknown one is rejected.
# See: docs/manual/14-isp-recipes.md "Authenticate by line identity: line-identity"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/line-identity/rradius.toml
#
# Relative paths are relative to the directory of this file.

dictionary = "../../../../share/dictionary"

# Without [auth], this script handles both authentication and accounting.
[lua]
script = "auth.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[radius]
bind = "0.0.0.0"
status_server = true

# List only the BNGs: line identity is not a secret, and anyone who can send requests from a source other than a BNG can impersonate any line.
[[radius.clients]]
name = "bng"
address = "10.60.0.0/24"
secret_file = "bng.secret"

[metrics]

# 線路身分認證（固網寬頻 IPoE）：BNG 把 DHCP Option 82 的 circuit-id、remote-id 放進 RADIUS 請求，
# 用戶沒有密碼，「哪一條線」就是身分。認得的線路回位址池名稱和設定檔名稱，不認得的拒絕。
# 說明：docs/manual/14-isp-recipes.md〈依線路身分認證：line-identity〉
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/line-identity/rradius.toml
#
# 相對路徑都以這個檔案所在的目錄為準。

dictionary = "../../../../share/dictionary"

# 沒有 [auth] 時，認證和計費都交給這個腳本。
[lua]
script = "auth.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[radius]
bind = "0.0.0.0"
status_server = true

# 只列 BNG：線路身分不是祕密，能讓 BNG 以外的來源送請求的人就能冒充任何一條線。
[[radius.clients]]
name = "bng"
address = "10.60.0.0/24"
secret_file = "bng.secret"

[metrics]

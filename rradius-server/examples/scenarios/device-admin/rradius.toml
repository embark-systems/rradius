# Network device administration (TACACS+): administrators log in to routers and switches; the role decides the privilege level and the commands allowed,
# and every command is recorded.
# Explanation: docs/manual/12-tacacs.md

dictionary = "../../../../share/dictionary"

# TACACS+ authorization and accounting both go to this script; authentication goes to the chain below.
[lua]
script = "tacacs.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM admins WHERE username = ? AND enabled = 1"

[tacacs]
bind = "0.0.0.0"
port = 49                    # needs privileges, see the manual
idle_timeout_ms = 300000

[[tacacs.clients]]
name = "core-routers"
address = "10.50.0.0/24"
secret_file = "tacacs.secret"

[metrics]

# MAC authentication (MAB) on wired networks: devices that cannot do 802.1X, such as printers, IP phones and cameras.
# The switch asks with the MAC address as the account name, and known devices are put into their own VLAN.
# Explanation: docs/manual/15-access-recipes.md "MAC authentication on wired networks: wired-mab"

dictionary = "../../../../share/dictionary"

# Without [auth], this script handles both authentication and accounting. The example script only looks at the MAC address and always replies to accounting.
[lua]
script = "mac-auth.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[radius]
bind = "0.0.0.0"
status_server = true

# All switches in the management subnet share one client.
[[radius.clients]]
name = "access-switches"
address = "10.40.0.0/24"
secret_file = "switches.secret"

[metrics]

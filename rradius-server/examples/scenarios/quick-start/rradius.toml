# Quick start: a single node, users in an SQL table, accounting written to a table.
# Explanation: docs/manual/03-quick-start.md
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/quick-start/rradius.toml
#
# Relative paths are relative to the directory of this file.

dictionary = "../../../../share/dictionary"

# With [auth] present, authentication goes to the chain below; this script only handles accounting.
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
# At startup, the SQL files in migrations/ are applied in order, creating the tables and the demo accounts.
migrations_dir = "migrations"

[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
# A disabled account is not found, which is the same as not existing: the chain has only this handler, so it is rejected.
user_query = "SELECT password FROM users WHERE username = ? AND enabled = 1"
reply_query = "SELECT attribute, value FROM user_reply WHERE username = ?"

[radius]
bind = "127.0.0.1"
# Answer Status-Server, so monitoring does not need a test account to log in.
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

# Sessions online now: rradiusd session list, or the sessions of one user:
# rradiusd session show alice. The query decides which rows count as online: here, rows that have not ended and
# were updated within the last 15 minutes (rows of a NAS that crashed without sending Stop do not stay forever).
[sessions]
list = "SELECT username, nas, session_id, started, updated FROM accounting WHERE stopped IS NULL AND updated > strftime('%s', 'now') - 900 ORDER BY started, session_id"
show = "SELECT username, nas, session_id, started, updated FROM accounting WHERE username = ?1 AND stopped IS NULL AND updated > strftime('%s', 'now') - 900 ORDER BY started, session_id"

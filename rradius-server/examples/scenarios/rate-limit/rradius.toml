# Rates (fixed broadband): one plan, with different rate attributes depending on the BNG's vendor.
# The sql handler checks the password; the lua handler returns the rate attributes by plan and client style.
# See: `docs/manual/14-isp-recipes.md` "Return rates by BNG: rate-limit"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/rate-limit/rradius.toml
#
# Relative paths are resolved against the directory that holds this file.

dictionary = "../../../../share/dictionary"

# With [auth], authentication goes to the chain below; this script handles only accounting (always replies).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept: run in order and stop at the first reject. Check the password first, then return the rate attributes.
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "rate.lua"

[radius]
bind = "127.0.0.1"
status_server = true

# One client per BNG. Which kind of attribute to return depends on this client's style in the nas_styles table;
# the name must match the client column of that table. A client not listed in the table gets Filter-Id.
[[radius.clients]]
name = "bng-default"
address = "127.0.0.1"
secret_file = "localhost.secret"

[[radius.clients]]
name = "bng-nokia"
address = "10.70.0.1"
secret_file = "nokia.secret"

[[radius.clients]]
name = "bng-mikrotik"
address = "10.70.0.2"
secret_file = "mikrotik.secret"

[[radius.clients]]
name = "bng-wispr"
address = "10.70.0.3"
secret_file = "wispr.secret"

[[radius.clients]]
name = "bng-erx"
address = "10.70.0.4"
secret_file = "erx.secret"

[metrics]

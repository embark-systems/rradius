# Static addresses and prefixes (fixed broadband): business users or particular plans get a fixed IPv4 address, a routed subnet and an IPv6 prefix.
# The sql handler checks the password; the lua handler returns the address attributes from the table.
# See: `docs/manual/14-isp-recipes.md` "Fixed addresses and prefixes: static-ip"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/static-ip/rradius.toml
#
# Relative paths are resolved against the directory that holds this file.

dictionary = "../../../../share/dictionary"

# With [auth], authentication goes to the chain below; this script handles only accounting (always replies).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept: run in order and stop at the first reject. Check the password first, then return the address attributes; a wrong password never reaches the later handler.
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "static.lua"

[radius]
bind = "127.0.0.1"
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

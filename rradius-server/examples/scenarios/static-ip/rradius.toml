# 固定位址與前綴（固網寬頻）：商業用戶或特定方案要固定的 IPv4 位址、路由的子網段、IPv6 前綴。
# 密碼由 sql 處理器驗，位址屬性由 lua 處理器依資料表回。
# 說明：docs/manual/14-isp-recipes.md〈固定位址與前綴：static-ip〉
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/static-ip/rradius.toml
#
# 相對路徑都以這個檔案所在的目錄為準。

dictionary = "../../../../share/dictionary"

# 有 [auth] 時認證交給下面的串接；這個腳本只處理計費（一律回覆）。
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept：依序執行，任一個拒絕就停。先驗密碼，再回位址屬性；密碼錯的人不會執行到後面。
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "static.lua"

[radius]
bind = "127.0.0.1"
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

# Per-user resource control: each user has a plan that limits concurrent sessions and traffic over a period. Single node.
# See: `docs/manual/14-isp-recipes.md` "Plans and usage control: usage-control"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/usage-control/rradius.toml
#
# Relative paths are resolved against the directory that holds this file.

dictionary = "../../../../share/dictionary"

# With [auth], authentication goes to the chain below; this script handles only accounting (recording traffic, confirming and releasing session slots).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept: run in order and stop at the first reject. The sql handler checks the password first (a wrong password goes no further, so it never
# takes a slot for someone who failed), then the lua handler checks the plan's traffic and concurrent sessions.
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "limits.lua"

[radius]
bind = "127.0.0.1"
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

# Users online now: rradiusd session list. A slot itself records who is online, so query it directly:
# rows whose state is active and that have not expired.
[sessions]
list = "SELECT username, nas, session_id, slot, updated FROM session_slots WHERE state = 'active' AND expires > strftime('%s', 'now') ORDER BY username, slot"
show = "SELECT username, nas, session_id, slot, updated FROM session_slots WHERE username = ?1 AND state = 'active' AND expires > strftime('%s', 'now') ORDER BY slot"

# Monitoring: the number of slots in each state becomes the metric rradius_query_slot_usage{state} (free is empty, reserved is held,
# active is online). Each node queries its own replica every 30 seconds; see chapter 14 of the manual, "Plans and usage control: usage-control", section "Monitoring".
# This query uses the session_slots_expiry index and does not scan the whole table.
[queries.slot_usage]
sql = "SELECT state, count(*) AS slots FROM session_slots GROUP BY state"
help = "Session slots by state: free, reserved or active."
labels = ["state"]
value = "slots"

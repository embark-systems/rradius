# Node 2 of the three-node high-availability cluster. The three configurations differ only in node_id and listen.
# Nodes talk to each other over WireGuard (10.99.0.0/24); for the setup see section 2.2 of docs/usage.md.
# Explanation: docs/manual/16-cluster.md "Several hosts: the ha-cluster scenario"
#
# The tables, the demo accounts (migrations/2_demo_users.sql; delete in production) and the accounting script (accounting.lua)
# are the same as in the quick start.

dictionary = "../../../../share/dictionary"

[lua]
script = "accounting.lua"
# When the cluster has lost its majority, a write waits this long before failing, after which accounting goes to the spool and the NAS gets its reply.
# Keep it shorter than the NAS retransmit interval, otherwise the NAS retransmission is treated as in progress and dropped.
query_timeout_ms = 2000

[cluster]
node_id = 2
listen = "10.99.0.2"           # listen for raft and api only on the WireGuard interface
data_dir = "data"
secret_raft_file = "raft.secret"  # must be the same on all three nodes
secret_api_file = "api.secret"    # must be the same on all three nodes
migrations_dir = "migrations"     # must be the same on all three nodes
migrations_wait_ms = 120000       # how long to wait for the other nodes when all restart together

[[cluster.nodes]]
id = 1
raft = "10.99.0.1:8100"
api = "10.99.0.1:8200"
[[cluster.nodes]]
id = 2
raft = "10.99.0.2:8100"
api = "10.99.0.2:8200"
[[cluster.nodes]]
id = 3
raft = "10.99.0.3:8100"
api = "10.99.0.3:8200"

[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM users WHERE username = ? AND enabled = 1"
reply_query = "SELECT attribute, value FROM user_reply WHERE username = ?"

[radius]
bind = "0.0.0.0"
# NASes and load balancers use it to tell whether the node is alive.
status_server = true

# Each NAS lists all three nodes as RADIUS servers. The shared secret must be the same on all three nodes.
[[radius.clients]]
name = "nas-network"
address = "10.80.0.0/16"
secret_file = "nas.secret"

# When the cluster has lost its majority and cannot write to the database, accounting is written locally first and replayed after recovery.
[radius.accounting_spool]
dir = "spool"
max_bytes = 1073741824

# The monitoring system scrapes from the internal network. There is no authentication, so do not expose it externally.
[metrics]
bind = "10.99.0.2"

[log]
format = "json"

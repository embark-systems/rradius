# Moving accounts from an old system: put the password hashes exported from the old directory, old RADIUS server or /etc/shadow into the table as they are,
# so users do not have to reset their passwords. When a password is changed later, it is stored in the new format.
# See: docs/manual/07-users-and-chains.md "Migrate password hashes from an old system"

dictionary = "../../../../share/dictionary"

[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
# The password column is {format}value; the server picks the comparison from the prefix, see docs/usage.md section 5.
user_query = "SELECT password FROM users WHERE username = ? AND enabled = 1"
reply_query = "SELECT attribute, value FROM user_reply WHERE username = ?"

# The old system's names vary in case and some carry a domain: normalize before looking up the account. The table always stores lowercase.
[auth.username]
strip_realm = "both"
lowercase = true

# After rradiusd user passwd the password is stored as bcrypt; accounts in the old format are replaced one by one this way.
# Change origin to rradius, so you can count how many accounts are still in the old format.
[accounts]
scheme = "bcrypt"
add = "INSERT INTO users (username, password, origin) VALUES (?1, ?2, 'rradius')"
passwd = "UPDATE users SET password = ?2, origin = 'rradius' WHERE username = ?1"
enable = "UPDATE users SET enabled = 1 WHERE username = ?1"
disable = "UPDATE users SET enabled = 0 WHERE username = ?1"
delete = "DELETE FROM users WHERE username = ?1"
show = "SELECT username, enabled, origin FROM users WHERE username = ?1"

[radius]
bind = "0.0.0.0"
status_server = true

[[radius.clients]]
name = "nas"
address = "10.90.0.0/24"
secret_file = "nas.secret"

[metrics]

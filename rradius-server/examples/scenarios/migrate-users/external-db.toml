# Accounts stay in the original PostgreSQL: the old system keeps maintaining the account tables and rradius only reads them. Accounting is still written to rradius's own tables.
# See: docs/manual/09-external-databases.md "Set up an external database"; for the fields see docs/usage.md section 2.17.

dictionary = "../../../../share/dictionary"

[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# The old system's database. Give rradius a read-only account that can read radcheck and radreply, nothing more.
[databases.legacy]
kind = "postgresql"
host = "db.example.com"
database = "radius"
user = "rradius_ro"
password_file = "legacy-db.secret"
# tls = "verify" is the default: it checks the database certificate and host name. Add ca_file when using your own CA.
pool_size = 8

[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
database = "legacy"
# The password column is again {format}value, see docs/usage.md section 5. Write the placeholder as ?; it becomes $1 when sent to PostgreSQL.
user_query = "SELECT password FROM radcheck WHERE username = ?"
reply_query = "SELECT attribute, value FROM radreply WHERE username = ?"

[auth.username]
strip_realm = "both"
lowercase = true

[radius]
bind = "0.0.0.0"
status_server = true

[[radius.clients]]
name = "nas"
address = "10.90.0.0/24"
secret_file = "nas.secret"

[metrics]

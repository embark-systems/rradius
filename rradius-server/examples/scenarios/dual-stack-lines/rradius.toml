# 雙堆疊線路（固網寬頻 IPoE）：用戶沒有密碼，BNG 轉送的 DHCP Option 82 說這是哪一條線。
# 線路有固定位址就回固定的，沒有就從 IPv4 位址池與 IPv6 前綴池各拿一個，計費確認與釋放。
# 說明：docs/manual/14-isp-recipes.md〈雙堆疊線路：dual-stack-lines〉
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/dual-stack-lines/rradius.toml
#
# 相對路徑都以這個檔案所在的目錄為準。

dictionary = "../../../../share/dictionary"

# 有 [auth] 時認證交給下面的 lua 處理器；這個腳本只處理計費（確認、延長、釋放位址與前綴）。
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# 一個 lua 處理器做完線路身分、固定資料、IPv4 池與前綴池（為什麼不是兩個處理器，見手冊）。
# 沒有密碼驗證，所以不需要 sql 處理器，串接只有這一個。
[auth]

[[auth.handlers]]
type = "lua"
script = "line.lua"

[radius]
bind = "0.0.0.0"
auth_port = 1812
acct_port = 1813
status_server = true

# 只列 BNG：線路身分不是祕密，能讓 BNG 以外的來源送請求的人就能冒充任何一條線。
[[radius.clients]]
name = "bng"
address = "10.60.0.0/24"
secret_file = "bng.secret"

[metrics]
bind = "127.0.0.1"
port = 9812

# 監控：每個池、每個狀態的數量（說明見手冊第 14 章〈IPv4 位址池〉與〈IPv6 前綴池〉的「監控」）。
[queries.pool_usage]
sql = "SELECT pool, state, count(*) AS addresses FROM ip_pool GROUP BY pool, state"
help = "Addresses of each IPv4 pool by state: free, reserved or active."
labels = ["pool", "state"]
value = "addresses"

[queries.prefix_usage]
sql = "SELECT pool, state, count(*) AS prefixes FROM prefix_leases GROUP BY pool, state"
help = "Prefixes of each IPv6 prefix pool by state: reserved, active or released."
labels = ["pool", "state"]
value = "prefixes"

# Dual-stack lines (fixed broadband IPoE): the user has no password; the DHCP Option 82 relayed by the BNG says which line this is.
# A line with a fixed address gets the fixed one; otherwise it gets one from the IPv4 address pool and one from the IPv6 prefix pool, confirmed and released by accounting.
# Explanation: docs/manual/14-isp-recipes.md "Dual-stack lines: dual-stack-lines"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/dual-stack-lines/rradius.toml
#
# Relative paths are all relative to the directory this file is in.

dictionary = "../../../../share/dictionary"

# When [auth] is present, authentication is handled by the lua handler below; this script handles only accounting (confirm, extend, release addresses and prefixes).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# One lua handler does line identity, fixed data, the IPv4 pool and the prefix pool (for why it is not two handlers, see the manual).
# There is no password check, so no sql handler is needed; the chain has only this one.
[auth]

[[auth.handlers]]
type = "lua"
script = "line.lua"

[radius]
bind = "0.0.0.0"
status_server = true

# List only the BNG: line identity is not a secret, and anyone who can send requests from a source other than the BNG could impersonate any line.
[[radius.clients]]
name = "bng"
address = "10.60.0.0/24"
secret_file = "bng.secret"

[metrics]

# Monitoring: the count per pool and per state (see "Monitoring and alerts" of "IPv4 address pool" and "IPv6 prefix pool" in manual chapter 14).
[queries.pool_usage]
sql = "SELECT pool, state, count(*) AS addresses FROM ip_pool GROUP BY pool, state"
help = "Addresses of each IPv4 pool by state: free, reserved or active."
labels = ["pool", "state"]
value = "addresses"

[queries.prefix_usage]
sql = "SELECT pool, state, count(*) AS prefixes FROM prefix_leases GROUP BY pool, state"
help = "Prefixes of each IPv6 prefix pool by state: reserved, active or released."
labels = ["pool", "state"]
value = "prefixes"

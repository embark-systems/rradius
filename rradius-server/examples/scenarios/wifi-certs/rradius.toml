# Wi-Fi with certificate login plus a revocation check: a lost laptop is blocked by the revocation list.
# See: docs/manual/11-eap.md "Block revoked certificates with a CRL"
#
# The certificates and the revocation list are not in the repo; run ./setup.sh to generate them.

dictionary = "../../../../share/dictionary"

[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# After the certificate passes (revocation check included), the name must also be in this table and enabled.
[auth]
policy = "first_match"

[[auth.handlers]]
type = "sql"
user_query = "SELECT NULL FROM devices WHERE name = ?"
certificate_query = "SELECT 1 FROM devices WHERE name = ? AND enabled = 1"
reply_query = """WITH d AS (SELECT vlan FROM devices WHERE name = ?)
  SELECT 'Tunnel-Type:1', 'VLAN' FROM d
  UNION ALL SELECT 'Tunnel-Medium-Type:1', 'IEEE-802' FROM d
  UNION ALL SELECT 'Tunnel-Private-Group-Id:1', vlan FROM d"""

[radius]
bind = "0.0.0.0"
status_server = true

[radius.eap]
cert_file = "certs/server.pem"
key_file = "certs/server.key"
client_ca_file = "certs/ca.pem"
methods = ["tls"]

# Revocation list (CRL): a certificate listed in it fails the handshake. Every CA level in the certificate chain needs a CRL.
# After the file is updated, send SIGHUP to make the server read it again.
crl_file = "certs/ca.crl"

[[radius.clients]]
name = "wlc"
address = "10.30.0.10"
secret_file = "wlc.secret"

[accounts]
enable = "UPDATE devices SET enabled = 1 WHERE name = ?1"
disable = "UPDATE devices SET enabled = 0 WHERE name = ?1"
show = "SELECT name, vlan, enabled FROM devices WHERE name = ?1"

[metrics]

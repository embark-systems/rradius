# Address pool: single node; an IP address is allocated from a pool in a table at authentication, and accounting confirms and releases it.
# See: docs/manual/14-isp-recipes.md "IPv4 address pool: ip-pool"
#
#   cd rradius-server
#   cargo run --release -- serve --config examples/scenarios/ip-pool/rradius.toml
#
# Relative paths are all relative to the directory this file is in.

dictionary = "../../../../share/dictionary"

# With [auth] configured, authentication goes to the chain below; this script only handles accounting (confirm, extend, release addresses).
[lua]
script = "accounting.lua"

[cluster]
data_dir = "data"
secret_raft_file = "raft.secret"
secret_api_file = "api.secret"
migrations_dir = "migrations"

# all_accept: run in order and stop at the first reject. The sql handler checks the password first (a wrong password does not go further, so no
# address is allocated to someone who did not pass), then the lua handler allocates the address.
[auth]
policy = "all_accept"

[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM subscribers WHERE username = ? AND enabled = 1"

[[auth.handlers]]
type = "lua"
script = "allocate.lua"

[radius]
bind = "127.0.0.1"
status_server = true

[[radius.clients]]
name = "localhost"
address = "127.0.0.1"
secret_file = "localhost.secret"

[metrics]

# Sessions online now: rradiusd session list. The address pool itself records who uses which address,
# so query it directly: rows whose state is active and that have not expired.
[sessions]
list = "SELECT username, nas, session_id, ip, updated FROM ip_pool WHERE state = 'active' AND expires > strftime('%s', 'now') ORDER BY ip"
show = "SELECT username, nas, session_id, ip, updated FROM ip_pool WHERE username = ?1 AND state = 'active' AND expires > strftime('%s', 'now') ORDER BY ip"

# Monitoring: the number of addresses in each state of each pool becomes the metric rradius_query_pool_usage{pool,state} (free means unused,
# reserved means reserved, active means in use). Each node queries its own replica every 30 seconds; see "Monitoring and alerts" in manual chapter 14, "IPv4 address pool: ip-pool".
# This query uses the ip_pool_state index and does not scan the whole table.
[queries.pool_usage]
sql = "SELECT pool, state, count(*) AS addresses FROM ip_pool GROUP BY pool, state"
help = "Addresses of each pool by state: free, reserved or active."
labels = ["pool", "state"]
value = "addresses"

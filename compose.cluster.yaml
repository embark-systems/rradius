# Three nodes. Each answers RADIUS on its own host ports: 1812/1813, 2812/2813, 3812/3813.
# Run docker/init-secrets.sh once first, then: docker compose -f compose.cluster.yaml up --build
services:
  node1:
    image: rradius-server
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["server", "--config", "/etc/rradius/cluster/node1.toml"]
    # The server only writes to the data volume and /tmp, and runs as an ordinary user, so the
    # root file system can be read-only and no capability is needed.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./docker/config:/etc/rradius:ro
      - data1:/var/lib/rradius
    secrets:
      - raft
      - api
      - radius

  node2:
    image: rradius-server
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["server", "--config", "/etc/rradius/cluster/node2.toml"]
    # The server only writes to the data volume and /tmp, and runs as an ordinary user, so the
    # root file system can be read-only and no capability is needed.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "2812:1812/udp"
      - "2813:1813/udp"
    volumes:
      - ./docker/config:/etc/rradius:ro
      - data2:/var/lib/rradius
    secrets:
      - raft
      - api
      - radius

  node3:
    image: rradius-server
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["server", "--config", "/etc/rradius/cluster/node3.toml"]
    # The server only writes to the data volume and /tmp, and runs as an ordinary user, so the
    # root file system can be read-only and no capability is needed.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3812:1812/udp"
      - "3813:1813/udp"
    volumes:
      - ./docker/config:/etc/rradius:ro
      - data3:/var/lib/rradius
    secrets:
      - raft
      - api
      - radius

volumes:
  data1:
  data2:
  data3:

secrets:
  raft:
    file: docker/secrets/raft.secret
  api:
    file: docker/secrets/api.secret
  radius:
    file: docker/secrets/radius.secret

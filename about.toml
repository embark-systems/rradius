# The third-party license lists of the release archives, made by packaging/release.sh with
# cargo-about for each program and platform. `accepted` is deny.toml's `allow`: change both.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what goes into the program: not the crates its tests use.
ignore-dev-dependencies = true
# The crates of this repository. rradius-server's archive carries their LICENSE;
# rradius-enterprise's carries no license of its own yet (see the third-party-notices change).
private = { ignore = true }

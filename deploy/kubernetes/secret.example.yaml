# The Secret statefulset.yaml mounts at /run/secrets/rradius. Not applied by kustomization.yaml,
# and holds no real secrets: create it with random ones instead, once, before the first apply:
#
#   kubectl create secret generic rradius-secrets \
#     --from-literal=raft="$(openssl rand -hex 32)" \
#     --from-literal=api="$(openssl rand -hex 32)" \
#     --from-literal=radius="the shared secret of your RADIUS devices"
#
# raft and api must stay the same on every node, which one Secret ensures. Its shape:
apiVersion: v1
kind: Secret
metadata:
  name: rradius-secrets
type: Opaque
stringData:
  raft: replace-with-openssl-rand-hex-32
  api: replace-with-openssl-rand-hex-32
  radius: replace-with-the-radius-shared-secret

# For measuring RadSec with rradius-bench only: everyone is accepted, and the secrets are in
# this file. The certificates are the ones eap.toml uses, made by the commands in "效能量測"
# in docs/usage.md into eap-certs/; the tool logs in with eap-certs/client.pem.
dictionary = "../../share/dictionary"

[lua]
script = "accept.lua"
max_execution_ms = 5000

[cluster]
data_dir = "data/radsec"
secret_raft = "bench-raft-secret-012345"
secret_api = "bench-api-secret-0123456"

[radius]
bind = "127.0.0.1"

# RadSec on 2083. Its shared secret is "radsec" (RFC 6614), whatever the client entry says.
[radius.tls]
bind = "127.0.0.1"
cert_file = "eap-certs/server.pem"
key_file = "eap-certs/server.key"
client_ca_file = "eap-certs/ca.pem"

[[radius.clients]]
name = "local"
address = "127.0.0.1"
secret = "bench-secret"

[metrics]
bind = "127.0.0.1"
port = 9812

# For measuring EAP-AKA' with rradius-bench only: every card has the keys of 3GPP TS 35.208
# test set 1, and aka.key and the subscriber rows are made by the commands in "效能量測" in
# docs/usage.md.
dictionary = "../../share/dictionary"

[lua]
script = "accept.lua"
max_execution_ms = 5000

[cluster]
data_dir = "data/aka"
secret_raft = "bench-raft-secret-012345"
secret_api = "bench-api-secret-0123456"
migrations_dir = "aka-migrations"

[radius]
bind = "127.0.0.1"

[radius.eap]
methods = ["aka-prime"]
# A load holds this many conversations at once, all from one client.
max_sessions = 65536
max_sessions_per_client = 65536

[radius.eap.aka]
network_name = "WLAN"
key_file = "aka.key"
subscriber_query = "SELECT ki, opc FROM aka_subscribers WHERE imsi = ?"
next_sqn_query = "UPDATE aka_subscribers SET sqn = sqn + 32 WHERE imsi = ? RETURNING sqn"
resync_query = "UPDATE aka_subscribers SET sqn = max(sqn, ?) + 32 WHERE imsi = ? RETURNING sqn"
# A load logs in each card many times a minute.
max_vectors_per_minute = 1000000

[[radius.clients]]
name = "local"
address = "127.0.0.1"
secret = "bench-secret"

[metrics]
bind = "127.0.0.1"
port = 9812

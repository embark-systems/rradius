# Used by compose.cluster.yaml. Only node_id differs between the nodes.
dictionary = "/usr/share/rradius/dictionary"

[lua]
script = "../auth.lua"

[cluster]
node_id = 2
data_dir = "/var/lib/rradius"
secret_raft_file = "/run/secrets/raft"
secret_api_file = "/run/secrets/api"
migrations_dir = "../migrations"

[[cluster.nodes]]
id = 1
raft = "node1:8100"
api = "node1:8200"

[[cluster.nodes]]
id = 2
raft = "node2:8100"
api = "node2:8200"

[[cluster.nodes]]
id = 3
raft = "node3:8100"
api = "node3:8200"

[auth]
[[auth.handlers]]
type = "sql"
user_query = "SELECT password FROM users WHERE username = ?"

[radius]
# Private networks, which is where Docker's own addresses come from. Narrow this to your
# devices. A device that cannot send a Message-Authenticator needs
# require_message_authenticator = "no" on its entry: see docs/usage.md.
[[radius.clients]]
address = "10.0.0.0/8"
secret_file = "/run/secrets/radius"

[[radius.clients]]
address = "172.16.0.0/12"
secret_file = "/run/secrets/radius"

[[radius.clients]]
address = "192.168.0.0/16"
secret_file = "/run/secrets/radius"

# /metrics, /livez and /readyz inside the container, for `rradius-server status`:
#   docker compose exec <service> rradius-server status --config <this file>
[metrics]
bind = "127.0.0.1"
port = 9812

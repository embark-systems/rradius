# License check of every dependency: `cargo deny --locked check licenses`, here and with
# `--manifest-path rradius-server/fuzz/Cargo.toml`. packages/tarball/release.sh runs it before it
# packages anything. Licenses, advisories (known vulnerabilities and unmaintained crates) and
# sources are checked; bans are not. The advisories check reads the RustSec database, so what it
# finds changes over time: CI runs it weekly and on request, not on every push.

[licenses]
# Permissive licenses only; about.toml's `accepted` lists the same, change both. An expression passes when one of its OR branches is all allowed,
# so `MIT OR Apache-2.0 OR LGPL-2.1-or-later` passes through MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Below this, a license file is not taken to be the license it looks like.
confidence-threshold = 0.8
exceptions = [
    # libFuzzer's license; the fuzz targets are not released.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
# The crates of this repository, all `publish = false`: rradius-enterprise is proprietary.
ignore = true

[advisories]
# Every crate of Cargo.lock is checked against the RustSec database. An advisory that cannot be
# fixed yet goes into `ignore` with its id and the reason, never without one.
ignore = [
    # chrono is marked unmaintained, with no replacement version to upgrade to. It comes in through
    # hiqlite, openraft and rusqlite, none of which this repository controls; look at it again when
    # hiqlite moves to another crate. Unmaintained, not a known vulnerability.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; a dependency of hiqlite" },
]

[sources]
# Crates come from crates.io only; there is no git or alternative-registry dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
